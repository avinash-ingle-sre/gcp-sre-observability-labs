apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-test
  namespace: gmp-aijl
  labels:
    app.kubernetes.io/name: prometheus-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-test
    spec:
      containers:
      - image: nilebox/prometheus-example-app:latest
        name: prometheus-test
        ports:
        - name: metrics
          containerPort: 1234
